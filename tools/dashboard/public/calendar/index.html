<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos Glyph - Calendar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            cyber: {
              cyan: '#00d4ff',
              purple: '#9b59b6',
              blue: '#3498db',
              pink: '#e91e63',
              background: '#050510',
              glass: 'rgba(255,255,255,0.05)',
              'glass-hover': 'rgba(255,255,255,0.1)',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: #050510;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* Animated gradient background */
    .cosmic-bg {
      background: linear-gradient(-45deg, #0a0a1a, #1a0a2e, #0a1a2e, #0a0a1a);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass effect */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-hover:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Event colors */
    .event-blue { background: rgba(52, 152, 219, 0.6); border-left: 3px solid #3498db; }
    .event-purple { background: rgba(155, 89, 182, 0.6); border-left: 3px solid #9b59b6; }
    .event-pink { background: rgba(233, 30, 99, 0.6); border-left: 3px solid #e91e63; }
    .event-cyan { background: rgba(0, 212, 255, 0.6); border-left: 3px solid #00d4ff; }
    .event-green { background: rgba(46, 204, 113, 0.6); border-left: 3px solid #2ecc71; }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Current day highlight */
    .today-month {
      background: rgba(0, 212, 255, 0.15) !important;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .today-week {
      border-left: 3px solid #00d4ff !important;
    }

    /* Modal animations */
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    /* Drag and drop styles */
    .dragging {
      opacity: 0.5;
    }

    .drop-target {
      background: rgba(0, 212, 255, 0.2) !important;
      border: 2px dashed #00d4ff;
    }
  </style>
</head>
<body class="cosmic-bg">
  <div id="app" class="min-h-screen p-4 md:p-6">
    <!-- Header -->
    <header class="glass rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4 animate-fade-in">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyber-cyan to-cyber-purple flex items-center justify-center shadow-lg">
          <i data-lucide="calendar" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-serif font-bold text-white">Chronos Glyph</h1>
          <p id="currentDate" class="text-sm text-gray-400"></p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- View Toggle -->
        <div class="glass rounded-lg p-1 flex">
          <button id="btnMonth" class="px-3 py-1.5 rounded text-sm font-medium bg-cyber-cyan/20 text-cyber-cyan transition-all" onclick="app.setView('month')">
            Month
          </button>
          <button id="btnWeek" class="px-3 py-1.5 rounded text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-all" onclick="app.setView('week')">
            Week
          </button>
          <button id="btnDay" class="px-3 py-1.5 rounded text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-all" onclick="app.setView('day')">
            Day
          </button>
        </div>

        <!-- Navigation -->
        <button onclick="app.previous()" class="glass glass-hover p-2 rounded-lg transition-all">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button onclick="app.today()" class="glass glass-hover px-4 py-2 rounded-lg text-sm font-medium hover:text-cyber-cyan transition-all">
          Today
        </button>
        <button onclick="app.next()" class="glass glass-hover p-2 rounded-lg transition-all">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>

        <!-- Add Event -->
        <button onclick="app.openEventModal()" class="bg-gradient-to-r from-cyber-cyan to-cyber-blue text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg hover:shadow-cyber-cyan/50 transition-all flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i>
          New Event
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="glass rounded-2xl p-4 md:p-6 min-h-[600px] animate-slide-up">
      <!-- Month View -->
      <div id="monthView" class="month-view hidden">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="monthTitle" class="text-2xl font-serif font-bold text-white"></h2>
        </div>
        <div class="grid grid-cols-7 gap-1">
          <!-- Day headers -->
          <div class="text-center text-sm font-medium text-gray-400 p-2">Sun</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Mon</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Tue</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Wed</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Thu</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Fri</div>
          <div class="text-center text-sm font-medium text-gray-400 p-2">Sat</div>

          <!-- Calendar days will be generated here -->
          <div id="monthGrid" class="contents"></div>
        </div>
      </div>

      <!-- Week View -->
      <div id="weekView" class="week-view hidden">
        <div class="mb-4">
          <h2 id="weekTitle" class="text-2xl font-serif font-bold text-white"></h2>
        </div>
        <div class="flex border-b border-white/10 mb-2">
          <div class="w-16"></div>
          <!-- Week day headers -->
          <div id="weekHeaders" class="flex-1 flex"></div>
        </div>
        <div class="flex">
          <div id="timeLabels" class="w-16 text-right pr-2 text-xs text-gray-400"></div>
          <div id="weekGrid" class="flex-1 relative"></div>
        </div>
      </div>

      <!-- Day View -->
      <div id="dayView" class="day-view hidden">
        <div class="mb-4">
          <h2 id="dayTitle" class="text-2xl font-serif font-bold text-white"></h2>
        </div>
        <div class="flex border-b border-white/10 mb-2">
          <div class="w-16"></div>
          <div class="flex-1 text-center text-sm text-gray-400">Timeline</div>
        </div>
        <div class="flex">
          <div id="dayTimeLabels" class="w-16 text-right pr-2 text-xs text-gray-400"></div>
          <div id="dayGrid" class="flex-1 relative"></div>
        </div>
      </div>
    </main>

    <!-- Event Modal -->
    <div id="eventModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
      <div class="glass rounded-2xl p-6 w-full max-w-md mx-4 animate-slide-up shadow-2xl">
        <div class="flex justify-between items-center mb-6">
          <h3 id="modalTitle" class="text-xl font-serif font-bold text-white">New Event</h3>
          <button onclick="app.closeEventModal()" class="text-gray-400 hover:text-white transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>

        <form id="eventForm" class="space-y-4">
          <input type="hidden" id="eventId">

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Title</label>
            <input type="text" id="eventTitle" required
                   class="w-full glass rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Date</label>
              <input type="date" id="eventDate" required
                     class="w-full glass rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Time</label>
              <input type="time" id="eventTime" required
                     class="w-full glass rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Duration</label>
              <select id="eventDuration" class="w-full glass rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all">
                <option value="30">30 min</option>
                <option value="60" selected>1 hour</option>
                <option value="90">1.5 hours</option>
                <option value="120">2 hours</option>
                <option value="180">3 hours</option>
                <option value="240">4 hours</option>
                <option value="300">5 hours</option>
                <option value="360">6 hours</option>
                <option value="420">7 hours</option>
                <option value="480">8 hours</option>
                <option value="1440">All day</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Color</label>
              <select id="eventColor" class="w-full glass rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all">
                <option value="blue">Blue</option>
                <option value="purple">Purple</option>
                <option value="pink">Pink</option>
                <option value="cyan">Cyan</option>
                <option value="green">Green</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Description (optional)</label>
            <textarea id="eventDescription" rows="3"
                      class="w-full glass rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all resize-none"></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Location (optional)</label>
            <input type="text" id="eventLocation"
                   class="w-full glass rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyber-cyan transition-all"
                   placeholder="Where?">
          </div>

          <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 bg-gradient-to-r from-cyber-cyan to-cyber-blue text-white font-medium py-2.5 rounded-lg shadow-lg hover:shadow-cyber-cyan/50 transition-all">
              Save Event
            </button>
            <button type="button" id="deleteBtn" onclick="app.deleteEvent()" class="hidden px-4 py-2.5 glass glass-hover text-red-400 rounded-lg hover:text-red-300 transition-all">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 glass rounded-lg px-4 py-3 shadow-lg transformTranslateY-10 opacity-0 transition-all duration-300 z-50 hidden">
      <div class="flex items-center gap-2">
        <i data-lucide="check-circle" class="w-5 h-5 text-cyber-cyan"></i>
        <span id="toastMessage" class="text-white text-sm"></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
