
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHONIC | Spectral Demo Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'bg-main': '#030303',
              'glass': 'rgba(255, 255, 255, 0.03)',
              'glass-border': 'rgba(255, 255, 255, 0.12)',
            },
            backgroundImage: {
              'spectral': 'linear-gradient(135deg, #ff00c1 0%, #00fff0 50%, #7000ff 100%)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #030303;
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
            radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.1) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(0, 255, 240, 0.08) 0%, transparent 40%);
        z-index: -1;
        pointer-events: none;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px) saturate(180%);
      }
      .chromatic-glow:hover {
        box-shadow: 0 0 30px rgba(0, 255, 240, 0.1), 0 0 30px rgba(255, 0, 193, 0.1);
      }
      @keyframes pulse-wave {
        0%, 100% { height: 20%; }
        50% { height: 90%; }
      }
      .wave-bar {
        animation: pulse-wave 1s infinite ease-in-out;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
